skill_name: "xxx-skill"
version: "0.2.0"
scope: "科研项目申请书多 Agent 生成、审查与交付"

inputs:
  required:
    project_title: "项目标题或研究主题"
    reference_materials: "用户提供的项目资料、技术方案、团队基础、指南或相关文本"
  optional:
    template_ref: "用户提供的模板文件或模板文本"
    template_type: "用户指定的内置模板族"
    funding_program: "申报计划或资助项目名称"
    output_formats:
      - markdown
      - json
      - docx

template_families:
  - basic_research
  - mission_rnd
  - social_science
  - industry_rnd
  - platform_construction
  - compact_proposal

template_policy:
  user_template_priority: true
  fallback_to_builtin_when_user_template_incomplete: true
  require_user_choice_when_type_unclear: true
  record_builtin_fill_assumptions: true

runtime_modes:
  preferred: parallel_multi_agent
  supported:
    - parallel_multi_agent
    - sequential_multi_role
    - single_agent_compact

degradation_policy:
  must_notify_user_before_degradation: true
  require_user_confirmation_for_single_agent_compact: true
  cancel_status: CANCELLED_BY_USER
  preserve_agent_result_contract: true
  preserve_human_review_gates: true

research:
  scope:
    allowed:
      - web_search
      - academic_db
    default: web_search
  must_use_network_for_formal_references: true
  no_offline_reference_fallback: true

human_review:
  default_enabled: true
  gates:
    - post_intake
    - degradation_confirm
    - post_template
    - post_outline
    - post_audit
  allow_user_disable: true
  require_override_record: true

delivery:
  output_formats:
    supported:
      - markdown
      - json
      - docx
    default:
      - markdown
      - json
  unsupported_formats:
    - html
    - pdf
  statuses:
    - READY_FOR_DELIVERY
    - DELIVERED_WITH_WARNINGS
    - BLOCKED
  always_output:
    - assumptions.md
    - audit_report.json
    - summary.md
    - manifest.json
  docx_validation:
    required_when_generated: true
    checks:
      - heading_levels
      - tables
      - images
      - citation_numbers
      - chinese_fonts
      - page_estimate
      - content_consistency

force_delivery_policy:
  allowed_when_user_explicitly_approves: true
  status_when_forced: DELIVERED_WITH_WARNINGS
  require_warning_acknowledgement: true
