skill_name: "xxx-skill"
version: "0.3.0"
scope: "科研项目申请书多 Agent 生成、审查与交付"

inputs:
  required:
    project_title: "项目标题或研究主题"
    reference_materials: "用户提供的项目资料、技术方案、团队基础、指南或相关文本"
  optional:
    content_template_ref: "用户提供的内容模板、申报指南或模板文本"
    docx_format_template_ref: "用户提供的 DOCX/Word 格式模板文件"
    template_type: "用户指定的内置模板族"
    funding_program: "申报计划或资助项目名称"
    output_formats:
      - markdown
      - json
      - docx

template_families:
  - basic_research
  - mission_rnd
  - social_science
  - industry_rnd
  - platform_construction
  - compact_proposal

template_policy:
  user_template_priority: true
  fallback_to_builtin_when_user_template_incomplete: true
  require_user_choice_when_type_unclear: true
  record_builtin_fill_assumptions: true

runtime_modes:
  preferred: parallel_multi_agent
  supported:
    - parallel_multi_agent
    - sequential_multi_role
    - single_agent_compact

degradation_policy:
  must_notify_user_before_degradation: true
  require_user_confirmation_for_single_agent_compact: true
  cancel_status: CANCELLED_BY_USER
  preserve_agent_result_contract: true
  preserve_human_review_gates: true

research:
  scope:
    allowed:
      - web_search
      - academic_db
    default: web_search
  must_use_network_for_formal_references: true
  no_offline_reference_fallback: true

human_review:
  default_enabled: true
  gates:
    - post_intake
    - degradation_confirm
    - post_template
    - post_outline
    - post_audit
  allow_user_disable: true
  require_override_record: true
  forced_gates:
    post_outline:
      required: true
      can_skip: false
      blocks_before:
        - SECTION_WRITING
      approval_requires:
        - OutlinePlan
        - SectionAssignment
        - LogicMap

delivery:
  output_formats:
    supported:
      - markdown
      - json
      - docx
    default:
      - markdown
      - json
  unsupported_formats:
    - html
    - pdf
  statuses:
    - READY_FOR_DELIVERY
    - DELIVERED_WITH_WARNINGS
    - BLOCKED
  always_output:
    - assumptions.md
    - audit_report.json
    - summary.md
    - manifest.json
  docx_validation:
    required_when_generated: true
    checks:
      - heading_levels
      - tables
      - figure_prompt_blocks
      - citation_numbers
      - chinese_fonts
      - western_fonts
      - font_size
      - line_spacing
      - paragraph_spacing
      - first_line_indent
      - page_margins
      - text_color
      - italic
      - hyperlink_style
      - horizontal_rules
      - page_estimate
      - content_consistency

figure_prompt_policy:
  actual_image_generation: false
  allowed_outputs:
    - image_prompt
    - mermaid_reference
    - both
  placement_decided_by: section_writer
  prompt_generated_by: figure_prompt_agent

source_reuse_policy:
  decomposition_agent: reference_material_decomposer
  registry_schema: schemas/source_segment_registry.schema.json
  assembly_plan_schema: schemas/source_segment_assembly_plan.schema.json
  outline_revision_schema: schemas/outline_revision_request.schema.json
  run_before:
    - content_analyst
    - outline_architect
  old_proposal_whole_reuse_allowed: false
  forbidden_old_context_defaults:
    - old_project_title
    - old_application_type
    - old_research_object
    - old_application_scenario
    - old_budget
    - old_indicators
    - old_partners
    - old_period
    - old_management_arrangements
    - unrelated_old_technical_route
  conditionally_reusable_segments:
    - team_basis
    - principal_investigator_experience
    - platform_condition
    - prior_achievement
    - dataset
    - long_term_collaboration
  require_user_confirmation_for_team_basis_reuse: true
  templates_are_not_fact_sources: true

file_qa_policy:
  required_after_delivery: true
  checks:
    - file_exists
    - file_openable
    - json_parse
    - docx_render_when_available
    - markdown_docx_content_consistency
    - figure_prompt_position_consistency

force_delivery_policy:
  allowed_when_user_explicitly_approves: true
  status_when_forced: DELIVERED_WITH_WARNINGS
  require_warning_acknowledgement: true
